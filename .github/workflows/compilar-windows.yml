name: Compilar ValidadorFirmas

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -r requisitos.txt

      - name: Compilar EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ValidadorFirmas validador_firmas.py

      - name: Guardar EXE
        uses: actions/upload-artifact@v4
        with:
          name: ValidadorFirmas-Windows
          path: dist/ValidadorFirmas.exe
